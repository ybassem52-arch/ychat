<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yChat - WhatsApp 11-Digit ID</title>
    <!-- مكتبات Firebase 9 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCC-FpCXBVV72taHtktK2WA6NElnzvDLF4",
            authDomain: "ychat-abf88.firebaseapp.com",
            projectId: "ychat-abf88",
            storageBucket: "ychat-abf88.firebasestorage.app",
            messagingSenderId: "522827662425",
            appId: "1:522827662425:web:44357f8f75793355ccdd48"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.setDoc = setDoc;
        window.doc = doc;
        window.getDoc = getDoc;
        window.collection = collection;
        window.addDoc = addDoc;
        window.onSnapshot = onSnapshot;
        window.query = query;
        window.orderBy = orderBy;
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        body { background-color: #0c1317; color: #e9edef; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .whatsapp-container { width: 100%; max-width: 480px; height: 100vh; background: #111b21; display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        @media (min-width: 768px) { .whatsapp-container { height: 92vh; border-radius: 10px; border: 1px solid #222d34; } }

        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        .hidden { display: none !important; }

        .whatsapp-header { background: #202c33; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; height: 60px; border-bottom: 1px solid #222d34; }
        .app-logo { font-size: 20px; font-weight: bold; color: #00a884; display: flex; align-items: center; gap: 8px; }
        
        .login-wrapper { padding: 30px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; background: #111b21; overflow-y: auto; }
        .login-logo-big { width: 80px; height: 80px; background: #00a884; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 35px; color: white; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,168,132,0.4); }
        .login-wrapper h2 { color: #e9edef; margin-bottom: 8px; font-size: 24px; }
        .login-wrapper p { color: #8696a0; font-size: 14px; margin-bottom: 25px; }
        .wa-input { width: 100%; padding: 14px 16px; margin: 8px 0; background: #2a3942; border: none; border-radius: 8px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; text-align: center; letter-spacing: 1px; }
        .wa-input:focus { border: 1px solid #00a884; }
        .file-upload-label { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; background: #2a3942; border-radius: 8px; color: #8696a0; cursor: pointer; margin: 8px 0; font-size: 14px; }
        .wa-btn { width: 100%; padding: 14px; margin-top: 15px; background: #00a884; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .wa-btn:hover { background: #008f72; }

        .search-bar-container { padding: 8px 12px; background: #111b21; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #222d34; }
        .search-box { flex: 1; background: #202c33; display: flex; align-items: center; padding: 8px 12px; border-radius: 8px; gap: 12px; }
        .search-box input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 14px; }
        .search-box input::placeholder { color: #8696a0; }
        .search-box i { color: #8696a0; font-size: 14px; }

        .chats-list { flex: 1; overflow-y: auto; background: #111b21; }
        
        .fab-btn { position: absolute; bottom: 25px; left: 25px; width: 56px; height: 56px; background: #00a884; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); cursor: pointer; border: none; transition: 0.3s; z-index: 10; }
        .fab-btn:hover { background: #008f72; transform: scale(1.05); }

        .room-header { background: #202c33; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; height: 60px; }
        .room-user-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .back-arrow { background: transparent; border: none; color: #aebac1; font-size: 18px; cursor: pointer; padding: 5px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #00a884; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #fff; overflow: hidden; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .messages-scroll { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; background-image: radial-gradient(#1f2c34 1px, transparent 1px); background-size: 24px 24px; background-color: #0b141a; }
        .message-bubble { max-width: 70%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; word-break: break-word; position: relative; box-shadow: 0 1px 0.5px rgba(0,0,0,0.3); }
        .msg-my { background: #005c4b; align-self: flex-end; border-top-left-radius: 0; color: #e9edef; }
        .msg-other { background: #202c33; align-self: flex-start; border-top-right-radius: 0; color: #e9edef; }
        .msg-time { font-size: 10px; color: #8696a0; float: left; margin: 5px 0 0 8px; line-height: 15px; }

        .room-input-area { background: #202c33; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
        .room-input-area input { flex: 1; background: #2a3942; border: none; padding: 12px 16px; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
        .send-icon-btn { background: #00a884; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; flex-shrink: 0; }
        .send-icon-btn:hover { background: #008f72; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: #111b21; padding: 25px; border-radius: 12px; width: 90%; max-width: 380px; border: 1px solid #222d34; }
        .modal-box h3 { color: #00a884; margin-bottom: 15px; font-size: 18px; }
    </style>
</head>
<body>

    <div class="whatsapp-container">
        
        <!-- 1. شاشة تسجيل الدخول -->
        <div id="login-screen" class="screen login-wrapper">
            <div class="login-logo-big"><i class="fa-solid fa-phone-volume"></i></div>
            <h2>مرحباً بك في yChat</h2>
            <p>أنشئ حسابك واحصل على رقم هاتف افتراضي (11 رقم)</p>
            <input type="text" id="input-name" class="wa-input" placeholder="اسمك الكريم...">
            <input type="text" id="input-bio" class="wa-input" placeholder="نبذتك الشخصية (اختياري)">
            <label class="file-upload-label" id="upload-label-text">
                <i class="fa-solid fa-camera"></i> اختر صورتك الشخصية
                <input type="file" id="input-image" accept="image/*" style="display: none;">
            </label>
            <button class="wa-btn" onclick="handleLogin()">دخول التطبيق 🚀</button>
        </div>

        <!-- 2. الشاشة الرئيسية (Chats) -->
        <div id="main-screen" class="screen hidden">
            <div class="whatsapp-header">
                <div class="app-logo"><i class="fa-solid fa-bolt"></i> yChat</div>
                <div style="font-size: 13px; color: #00a884; font-weight: bold;" id="my-generated-phone">رقمك: جاري التوليد...</div>
            </div>

            <div class="search-bar-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="بحث في المحادثات...">
                </div>
            </div>

            <div class="chats-list" id="chats-list-container">
                <div style="text-align: center; color: #8696a0; margin-top: 100px; padding: 20px;">
                    <i class="fa-regular fa-comment-dots" style="font-size: 48px; margin-bottom: 10px;"></i><br>
                    لا توجد محادثات نشطة.<br>اضغط على زر الإضافة بالأسفل وأدخل رقم صديقك (11 رقم)!
                </div>
            </div>

            <button class="fab-btn" onclick="openAddContactModal()"><i class="fa-solid fa-user-plus"></i></button>
        </div>

        <!-- 3. شاشة الشات المباشر -->
        <div id="chat-room-screen" class="screen hidden">
            <div class="room-header">
                <div class="room-user-info">
                    <button class="back-arrow" onclick="closeChatRoom()"><i class="fa-solid fa-arrow-right"></i></button>
                    <div class="avatar" id="room-avatar">?</div>
                    <div>
                        <div class="chat-username" id="room-contact-name" style="font-size: 15px;">اسم الصديق</div>
                        <div class="chat-time" id="room-contact-id">010XXXXXXXX</div>
                    </div>
                </div>
                <div class="header-icons" style="gap: 15px;">
                    <i class="fa-solid fa-phone" onclick="startAudioCall()" title="مكالمة صوتية"></i>
                </div>
            </div>

            <div class="messages-scroll" id="messages-box"></div>

            <div class="room-input-area">
                <input type="text" id="message-input" placeholder="اكتب رسالة..." onkeypress="checkEnter(event)">
                <button class="send-icon-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

    </div>

    <!-- نافذة إضافة صديق بالـ 11 رقم -->
    <div id="add-contact-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>إضافة صديق برقم الهاتف</h3>
            <p style="color: #8696a0; font-size: 13px; margin-bottom: 15px;">أدخل رقم الصديق المكون من 11 رقم لفتح المحادثة:</p>
            <input type="text" id="target-phone-input" class="wa-input" placeholder="01012345678" maxlength="11">
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="wa-btn" style="background: #2a3942;" onclick="closeAddContactModal()">إلغاء</button>
                <button class="wa-btn" onclick="openChatWithContact()">مراسلة</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = { id: "", name: "", bio: "", avatar: "" };
        let currentTargetId = "";
        let uploadedImageBase64 = "";

        document.getElementById('input-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageBase64 = event.target.result;
                    const label = document.getElementById('upload-label-text');
                    label.style.color = "#00a884";
                    label.innerHTML = `<i class="fa-solid fa-check"></i> تم اختيار الصورة بنجاح`;
                };
                reader.readAsDataURL(file);
            }
        });

        function generateUnique11DigitId() {
            let randomPart = Math.floor(10000000 + Math.random() * 90000000);
            return "010" + randomPart;
        }

        async function handleLogin() {
            const name = document.getElementById('input-name').value.trim();
            const bio = document.getElementById('input-bio').value.trim() || "متاح للدردشة على yChat";

            if (!name) {
                alert("من فضلك أدخل اسمك على الأقل!");
                return;
            }

            const assignedId = generateUnique11DigitId();

            currentUser.id = assignedId;
            currentUser.name = name;
            currentUser.bio = bio;
            currentUser.avatar = uploadedImageBase64;

            document.getElementById('my-generated-phone').innerText = `رقمك: ${assignedId}`;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');

            try {
                await window.setDoc(window.doc(window.db, "users", assignedId), {
                    name: name,
                    bio: bio,
                    avatar: uploadedImageBase64,
                    lastSeen: new Date()
                });
            } catch (error) {
                console.error("خطأ أثناء حفظ المستخدم:", error);
            }
        }

        function openAddContactModal() {
            document.getElementById('add-contact-modal').classList.remove('hidden');
        }

        function closeAddContactModal() {
            document.getElementById('add-contact-modal').classList.add('hidden');
        }

        async function openChatWithContact() {
            const targetId = document.getElementById('target-phone-input').value.trim();
            if (!targetId || targetId.length !== 11) {
                alert("من فضلك أدخل رقم صحيح مكون من 11 رقم!");
                return;
            }
            if (targetId === currentUser.id) {
                alert("لا يمكنك مراسلة نفسك!");
                return;
            }

            let targetName = targetId;
            let targetAvatar = "";

            try {
                const userDoc = await window.getDoc(window.doc(window.db, "users", targetId));
                if (userDoc.exists()) {
                    targetName = userDoc.data().name;
                    targetAvatar = userDoc.data().avatar;
                } else {
                    alert("عذراً، هذا الرقم غير مسجل على شبكة yChat! تأكد أن صاحبه قام بتسجيل الدخول أولاً.");
                    return;
                }
            } catch (e) {
                console.log("خطأ في جلب بيانات الصديق");
            }

            currentTargetId = targetId;
            document.getElementById('room-contact-name').innerText = targetName;
            document.getElementById('room-contact-id').innerText = targetId;
            
            const roomAvatarEl = document.getElementById('room-avatar');
            if(targetAvatar) {
                roomAvatarEl.innerHTML = `<img src="${targetAvatar}">`;
            } else {
                roomAvatarEl.innerText = targetName.substring(0, 2).toUpperCase();
            }

            closeAddContactModal();
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('chat-room-screen').classList.remove('hidden');

            loadMessages();
        }

        function closeChatRoom() {
            document.getElementById('chat-room-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            currentTargetId = "";
        }

        async function sendMessage() {
            const text = document.getElementById('message-input').value.trim();
            if (!text || !currentTargetId) return;

            // توحيد ID الغرفة بين الطرفين بدقة شديدة
            const chatId = [currentUser.id, currentTargetId].sort().join('_');

            try {
                await window.addDoc(window.collection(window.db, "chats", chatId, "messages"), {
                    sender: currentUser.id,
                    text: text,
                    timestamp: new Date()
                });
                document.getElementById('message-input').value = "";
            } catch (error) {
                console.error("خطأ في إرسال الرسالة:", error);
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        let unsubscribeMessages = null;

        function loadMessages() {
            const chatId = [currentUser.id, currentTargetId].sort().join('_');
            const messagesBox = document.getElementById('messages-box');
            
            // إلغاء أي اتصال قديم للاستماع لمنع تكرار الرسائل
            if (unsubscribeMessages) unsubscribeMessages();

            const q = window.query(window.collection(window.db, "chats", chatId, "messages"), window.orderBy("timestamp", "asc"));
            
            unsubscribeMessages = window.onSnapshot(q, (snapshot) => {
                messagesBox.innerHTML = "";
                if (snapshot.empty) {
                    messagesBox.innerHTML = `<div style="text-align: center; color: #8696a0; margin-top: 30px; font-size: 13px;">لا توجد رسائل بعد. ابدأ قول سلام! 👋</div>`;
                    return;
                }
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMyMsg = msg.sender === currentUser.id;
                    
                    const timeStr = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message-bubble ${isMyMsg ? 'msg-my' : 'msg-other'}`;
                    msgDiv.innerHTML = `${msg.text} <span class="msg-time">${timeStr}</span>`;
                    messagesBox.appendChild(msgDiv);
                });
                messagesBox.scrollTop = messagesBox.scrollHeight;
            });
        }

        function startAudioCall() {
            alert("ميزة المكالمات الصوتية (WiFi Calling) جاري ربطها بالكامل عبر WebRTC يا عظمة!");
        }
    </script>
</body>
</html>
